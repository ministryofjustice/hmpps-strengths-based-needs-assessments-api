name: PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  helm_lint:
    name: Helm lint
    strategy:
      matrix:
        environments: ['dev', 'test', 'preprod', 'prod']
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}

  build_docker:
    name: Build docker image
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      tag_latest: false
      push: false
      load: true
      docker_multiplatform: false
      upload_image_artifact: true
      image_artifact_retention_days: 2

  e2e_test:
    needs: build_docker
    uses: ./.github/workflows/e2e_test.yml
    with:
      app_version: ${{ needs.build_docker.outputs.app_version }}

  migrator_test:
    name: Test the migrator
    needs:
      - build_docker
      - e2e_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download docker image
        uses: actions/download-artifact@v8
        with:
          name: build_image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input ${{ runner.temp }}/build_image.tar

      - name: Stand up the migrator environment
        run: make migrator-up

      - name: Download combined database dump
        uses: actions/download-artifact@v8
        with:
          name: combined_db_dump
          path: ${{ runner.temp }}/db-dump

      - name: Import combined database dump
        run: make migrator-import-dump DB_DUMP_FILE=${{ runner.temp }}/db-dump/combined_db_dump.sql

      - name: Run the migrator
        run: make migrator-run

      - name: Export assessment-platform schema dump
        if: success() || failure()
        run: make migrator-export-schema OUTPUT_DUMP_FILE=${{ runner.temp }}/assessment_platform_dump.sql SCHEMA=assessment-platform

      - name: Upload assessment-platform schema dump
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: assessment_platform_dump
          path: ${{ runner.temp }}/assessment_platform_dump.sql
