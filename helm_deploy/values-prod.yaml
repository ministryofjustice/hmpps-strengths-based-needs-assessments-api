    ASSESSMENT_PLATFORM_API_BASE_URL: https://arns-assessment-platform-api.hmpps.service.justice.gov.uk
    COORDINATOR_API_BASE_URL: https://arns-coordinator-api.hmpps.service.justice.gov.uk

dataExtractor:
  enabled: true
